name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The site is plain HTML/CSS/JS — nothing to build. Upload the repo root,
      # minus the source material that should not be part of the website.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -r index.html menu.html robots.txt sitemap.xml .nojekyll assets _site/

      # Pages must already be enabled with Source = GitHub Actions. The action
      # can enable it itself (enablement: true), but creating a Pages site
      # needs repository-admin rights that GITHUB_TOKEN does not carry, so
      # that path fails with "Resource not accessible by integration".
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
